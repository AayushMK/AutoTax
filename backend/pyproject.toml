[project]
name = "autotax-backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.11.0",
    "bcrypt>=5.0.0",
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.2",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "nepali-datetime>=1.0.8.5",
    "psycopg[binary]>=3.3.6",
    "pydantic[email]>=2.13.5",
    "pyjwt>=2.15.1",
    "pypdf>=6.19.0",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "openpyxl>=3.1.5",
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
