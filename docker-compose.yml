services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: autotax
      POSTGRES_PASSWORD: autotax
      POSTGRES_DB: autotax
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autotax"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
